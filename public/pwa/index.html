<!DOCTYPE html>

  <head>

    <title>Studos</title>
    <style id="expo-reset">
      html,
      body {
        height: var(--studos-pwa-height, 100vh);
        min-height: var(--studos-pwa-height, 100vh);
        overscroll-behavior: none;
        background: #ffffff;
      }

      body {
        margin: 0;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        display: flex;
        height: var(--studos-pwa-height, 100vh);
        min-height: var(--studos-pwa-height, 100vh);
        flex: 1;
        position: relative;
        background: #f1fbf8;
        z-index: 1;
      }

      body::after {
        content: '';
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: env(safe-area-inset-bottom, 0px);
        background: #ffffff;
        pointer-events: none;
        z-index: 0;
      }

      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: var(--studos-pwa-height, 100dvh);
          min-height: var(--studos-pwa-height, 100dvh);
        }
      }

      @supports (-webkit-touch-callout: none) {
        html,
        body,
        #root {
          height: var(--studos-pwa-height, 100vh);
          min-height: var(--studos-pwa-height, 100vh);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Du skal slaa JavaScript til for at bruge Studos.</noscript>
    <div id="root"></div>
    <script>
      var STUDOS_PWA_VERSION = 'v8';

      (function () {
        function setStudosViewportHeight() {
          var layoutHeight = window.innerHeight || 0;
          var visualHeight = window.visualViewport ? window.visualViewport.height : 0;
          var height = Math.max(layoutHeight, visualHeight);

          if (height) {
            document.documentElement.style.setProperty('--studos-pwa-height', height + 'px');
          }
        }

        setStudosViewportHeight();
        window.addEventListener('resize', setStudosViewportHeight);
        window.addEventListener('orientationchange', function () {
          window.setTimeout(setStudosViewportHeight, 250);
        });

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setStudosViewportHeight);
        }
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js?v=' + STUDOS_PWA_VERSION, { scope: '/' }).catch(function () {});
        });
      }
    </script>
